<mat-card>
  <mat-card-header>
    <mat-card-title>Presentation Options</mat-card-title>
    <mat-card-subtitle>
      Configure the options for your presentation request.
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <ng-container *ngIf="dcApiSupported; else unsupported">
      <div class="request-options-grid">
        <div class="request-options-row">
          <div class="request-options-label">
            <span>Presentation Profile</span>
            <p class="request-options-helper">
              The presentation requests follows the rules defined by
              <a
                target="_blank"
                href="https://www.etsi.org/deliver/etsi_ts/119400_119499/11947202/01.02.01_60/ts_11947202v010201p.pdf"
                >ETSI TS 119 472-2 v1.2.1</a
              >.
            </p>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #unsupported>
      <div class="unsupported-message">
        <p>DC API is not supported by the current user agent.</p>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
